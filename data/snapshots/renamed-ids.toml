# Steps whose id changed after runs had been saved under the old one.
#
# A saved run is never rewritten, so a run taken before a rename still holds the step under its
# old id. The compute script reads this file whenever it loads the saved runs and reads each old
# id as the new one, so the history charts, the ledger's before-and-after figures and the tests
# follow a step across its rename. Nothing else uses the old ids: the tree, the site's pages and
# their addresses carry only the new ones.
#
# Renaming is not the ordinary way to change a published step (docs/methodology.md, "What is fixed
# and what moves": a step whose meaning changes is retired and replaced). These renames change no
# name, criterion, number or link; only the id, and with it the page's address.
#
# A step renamed twice has two rows, and the compute script follows them to the newest id. The
# renames of 2026-11-14 came with a rewording of the same steps that keeps their meaning; each
# reworded field is a revision on its step in data/A-access.toml.
#
# The old ids that named my current career are written here, and in the saved runs, as
# withdrawn codes (A-withdrawn-id-1 to A-withdrawn-id-8, withdrawn-fork-1) instead of the ids
# themselves, decided 2026-11-14. Each code stands for one old id and is used for nothing else.
# The codes are plain numbers, not worked out from the old words, so they cannot be turned back
# into them. This is the one change ever made to the saved runs: only these labels changed, and
# every number in every run is as it was.

[[renamed]]
old = "A-withdrawn-id-1"
new = "A-current-training-completed"
date = 2026-10-03
why = "The id described my current career, which no public surface does until May 2027 (decided 2026-09-25; rename ruled 2026-10-03)."

