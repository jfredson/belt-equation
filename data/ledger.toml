[[entry]]
id = "2026-09-20-forty-one-criteria-tightened"
date = 2026-09-20
kind = "structure"
title = "Forty-one steps had their criteria tightened so that two readers would agree when each has happened, with no number moved for that alone"
body = """
Astra's pass over almost every step, and Gemini's over ten, found the same kind of slack
throughout: undefined words ('heavy', 'most of the joining', 'main transfer', 'beyond the
Earth-Moon system'), references with no fixed baseline (the superconducting tape price), tests
an ordinary object could pass (an unshielded reference that a plain hull satisfies), and
subjective words ('understood by humans'). John accepted or accepted with change on every one
of these rows, declining only where a fix would have made a step unmeasurable or turned a leaf
into a research programme. Two steps were renamed to say what they measure (the
constant-acceleration drive is now an engine with both high thrust and high exhaust speed; the
first nuclear burn now names its kilometre per second) and one description corrected on the
record (SNAP-10A ran a reactor-powered ion thruster in 1965). Where a criterion got harder or
easier enough to matter, the number moved in its own entry above; these rewordings alone moved
nothing, but a criterion changed after estimation breaks like-for-like comparison, which is why
this is a structural entry."""
nodes = [
  "W-composite-aging-trial-positive-in-humans", "W-first-drug-approved-to-slow-aging", "W-dog-rapamycin-trial-reports-longer-life", "W-regulator-accepts-aging-as-an-indication",
