[[item]]
node = "L-heavy-launcher-100-per-year"
verdict = "noted"
queries = ["Starship launches 2026 total orbital flights count list of Starship launches", "SpaceX Starship launch cadence 2027 plan flights per year after Flight 15 Musk Shotwell"]
found = "Starship's Flight 15 launched on 2026-11-13 and reached orbit, its fourth flight and second orbital flight of 2026, and its upper stage was caught on 2026-11-14 while the booster was lost. That is far from 100 orbital flights in a year with both stages recovered on half of them, so no number moves. SpaceX's stated aim of weekly flights in the first half of 2027 is a plan, not a count."
sources = ["https://www.cbsnews.com/news/spacex-catch-starship-rocket/", "https://www.space.com/news/live/spacex-starship-flight-15-live-updates-nov-14-2026-starship-first-double-landing-attempt"]
ledger = "2026-11-15-starship-upper-stage-caught-booster-lost"

[[item]]
node = "L-fully-reusable-heavy-launcher-recovers-both-stages"
verdict = "noted"
queries = ["SpaceX Starship Flight 15 ship catch booster lost post-flight statement reuse", "Starship Flight 15 upper stage caught tower November 14 2026 booster low fuel Gulf what's next Flight 16"]
found = "On Flight 15 the launch tower caught the upper stage on 2026-11-14 after about 22 hours in orbit, the first recovery of a Starship from orbit. The booster's catch was called off after launch on 2026-11-13, and it ran out of fuel and broke up over the Gulf of Mexico. The criterion needs both stages of one orbital flight retrieved and confirmed by the operator as able to fly again; one stage came back and no such statement has been made, so it is not met and no number moves."
sources = ["https://www.cbsnews.com/news/spacex-catch-starship-rocket/", "https://www.space.com/news/live/spacex-starship-flight-15-live-updates-nov-14-2026-starship-first-double-landing-attempt", "https://www.cnbc.com/2026/11/14/spacex-plans-to-try-first-ever-catch-of-starship-rocket-from-orbit.html"]
ledger = "2026-11-15-starship-upper-stage-caught-booster-lost"
article = "Big news on a high-stakes step: the launch tower caught Starship's upper stage from orbit for the first time on 2026-11-14, the half of the rocket that had never come back, but the booster of the same flight was lost. The step needs both stages home from one flight and confirmed fit to fly again, so the tree holds it at 95 percent and nothing moved; the next flight that catches both would settle it."

