[[item]]
node = "B-staple-crop-grown-from-seed-to-harvest-off-earth"
verdict = "flagged"
queries = ["wheat OR rice OR potato harvest grown in space kilogram yield Tiangong OR ISS OR Moon 2026", "Chinese Academy of Sciences rice Tiangong full life cycle seed to seed 2022 120 days Wentian", "Shenzhou-23 rice harvest yield grams second generation Tiangong CAS announcement"]
found = "No harvest of one kilogram of edible grain or tuber off Earth has been reported. The Shenzhou-23 crew collected first-generation rice seeds on Tiangong on about 2026-08-02 and a second generation is growing, with no yield weight published. On the verify claim: the 2022 Tiangong rice did complete seed to seed (six seeds sown, 59 harvested), but the CAS record says the ears matured after over 100 days, not about 120."
sources = ["https://english.cas.cn/newsroom/cas_media/202411/t20241107_693870.shtml", "https://cislunarspace.cn/en/space-news/2026/08/2026-08-03-tiangong-rice-two-generations/"]
for_john = "Verify claim settled in part, so it comes to you because the scan may not edit the list: rice did complete a seed-to-seed cycle on Tiangong in 2022 (CAS, 2024-11-07 report), but the record's 'about 120 days' is not supported; CAS says over 100 days. Suggest correcting the wording to 'over 100 days' and clearing the claim. No probability move: the 2026 rice work is still seeds, not a one-kilogram harvest."

