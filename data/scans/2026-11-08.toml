[[item]]
node = "C1"
verdict = "quiet"
queries = ["AlphaEvolve peer-reviewed paper journal published mathematics November 2026", "DeepMind AlphaEvolve Nature OR Annals OR journal accepted \"AlphaEvolve\" 2026 mathematics paper published", "AlphaTensor Nature 2022 47 multiplications 4x4 matrices modulo 2 beats best human algorithm", "Erdős unit distance conjecture disproof OpenAI journal published peer-reviewed", "Erdős unit distance OpenAI arXiv \"Remarks on the disproof\" journal accepted", "AI system discovers new mathematical construction beyond human researchers Nature paper 2026", "AI proof formally verified Lean new theorem discovered by AI model acknowledged peer-reviewed past week"]
found = "Verify list: AlphaEvolve's mathematics results are still preprints (arXiv 2511.02864, with later versions to December 2025) and no journal acceptance turned up. AlphaTensor's fact is confirmed as stated (Nature, October 2022, 47 multiplications for 4x4 over modulo 2, against 49), and it stays unresolved under the strict reading. The Erdős unit-distance disproof (announced 2026-05-20) has an arXiv companion paper, 2605.20695 by Alon, Bloom and Wood, and no journal publication or acceptance was found. FunSearch was not searched, as the verify list says to leave it until after 2026-12-31."

