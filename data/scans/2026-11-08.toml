source = "https://arxiv.org/abs/2611.02371"
found = "A preprint submitted on 2026-11-02 combines 89 years of archival images to give 2026 ED138 a diameter of 635 to 1,590 kilometres, a probable Haumea-like oval shape and a light-curve period of about 10.4 hours, and predicts 15 stellar occultations from 2027 to 2030."
