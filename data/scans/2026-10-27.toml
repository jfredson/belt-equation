[[discovery]]
title = "Comet-like activity found on the main-belt asteroid 6993 (1995 BJ4)"
date = 2026-10-26
source = "https://arxiv.org/abs/2610.31910"
via = "arXiv, planetary science papers of the past week"
found = "A paper posted on 2026-10-26 and accepted by the Astrophysical Journal Letters reports that the outer main-belt asteroid 6993 (1995 BJ4), about 12 kilometres across, was seen shedding material from 2026-06-25 in Zwicky Transient Facility images, which would make it the largest known main-belt comet if the activity comes from ice turning to gas rather than from an impact."
node = "none"
