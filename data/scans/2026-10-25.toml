verdict = "flagged"
queries = ["AlphaEvolve mathematics paper journal published peer-reviewed accepted", "OpenAI Erdős unit distance disproof journal publication peer review", "AlphaTensor Nature matrix multiplication 47 multiplications update 2026", "AI-generated mathematical proof new result peer-reviewed journal acknowledged beyond human mathematicians October 2026", "AlphaProof Nexus Science Erdős problems OEIS conjectures DeepMind"]
found = "Verify claims: AlphaEvolve's mathematics paper is still the arXiv preprint 2511.02864 (2025-11-03) with no journal acceptance found; the OpenAI Erdős unit-distance disproof (announced 2026-05-20) has arXiv papers and outside checking but no journal publication found; AlphaTensor's Nature paper of 2022-10-05 is unchanged and stays unresolved under the strict reading. New this week: Google DeepMind's AlphaProof Nexus is reported as published in Science on 2026-10-08 (nine of 353 open Erdős problems and 44 of 492 open OEIS conjectures proved, every proof machine-checked in Lean), a peer-reviewed record the node's list does not yet name. I could not open the Science paper (science.org returned 403) or the arXiv preprint, so I cannot say whether it credits the key ideas to the system or calls the results beyond human work."
sources = ["https://xenospectrum.com/en/alphaproof-nexus-math-proof-science/", "https://the-decoder.com/google-deepminds-alphaproof-nexus-solves-decades-old-math-problems-for-a-few-hundred-dollars/", "https://aiweekly.co/alerts/deepmind-alphaproof-nexus-solves-9-erds-problems"]
for_john = "No move made. Proposal: add AlphaProof Nexus (Science, 2026-10-08; arXiv 2605.22763; Lean proofs at github.com/google-deepmind/alphaproof-nexus-results) to C1's verify list as a candidate, to be read against the criterion by the next scan. The criterion needs the peer-reviewed record to say the key idea was the system's and that the result goes beyond what humans had produced; secondary coverage describes Gemini devising the proof strategy and Lean checking it, and says the nine Erdős solutions are not all full solutions of the original problems (Erdős 12 is only partly solved), so it may well not meet the bar. I could not fetch the primary pages (science.org 403; arXiv not fetched), so I am not proposing a correction, only that the paper be read directly."

