# A made-up scan record, written by hand on 2026-09-19 so that the Radar page, the home
# page strip and the node pages have something to render before the first real scan runs
# (docs/scan-plan.md, steps 34 and 37). Nothing in it happened. Every finding below is
# placeholder text, every source is an example address that goes nowhere, and no node in
# data/ was edited on the strength of it.
#
# `test = true` in the [scan] table is what says so. The export script (scripts/export.py)
# carries the mark into site/src/data/scans.json, the site labels every surface that shows
# this scan as a test, and the validator lets a test record name a ledger entry that was
# never written. Delete this file once a real scan has run.

