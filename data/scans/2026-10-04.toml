found = "On Flight 14 (2026-09-28) the booster splashed down in the Gulf of Mexico and the ship made a controlled splashdown in the Pacific, with no tower catch attempted for either stage; neither was retrieved or declared reflight-ready. The flight reached orbit but no recovery occurred, so the criterion is not met and no probability moves; catch attempts are deferred to Flight 15, with provisional planning pointing to 2026-10-19 at the earliest."
