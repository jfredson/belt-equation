# Nodes under the regime factor (R): that the political and legal conditions let a
# multi-decade build survive elections, downturns, and wars. Regime nodes are the shared
# parents that carry common causes (a funding collapse hits everything at once), so the edges
# step should wire them widely. Record layout: docs/node-schema.md. Drafted 2026-09-08 in the
# third brainstorm session. First probabilities 2026-09-19 (roadmap step 9, group three).

[[node]]
id = "R-crewed-lunar-program-outlives-two-changes-of-president"
name = "A crewed lunar program keeps flying across two changes of its government"
factor = "R"
kind = "world"
description = """
Every large space program since Apollo has been redrawn or cancelled by a new
administration. A program that keeps its funding and keeps flying hardware across two
changes of the government that pays for it has become an institution rather than a policy,
which is what a multi-decade build needs. Any nation's or company's crewed lunar program
counts, because lunar material at scale can come from anyone's program; the US program is
the one to watch first. It gates the Slow Expanse through lunar material at scale."""
resolution = """
A crewed lunar program (a national program or a company's program with a national anchor
customer) receives its yearly funding and flies crewed hardware in each of two successive
governments after the one in office when it first flew crew, a change of government meaning
a change in the head of government, or for a company program a change in the head of its
anchor customer's government. A program that is cancelled and later restarted, or a
different nation's program that reaches the mark, resolves the node when it gets there."""
source = "The funding nation's appropriations records and the program's flight record"
horizon = "mid"
depends_on = []
status = "superseded"
superseded_by = "R-crewed-lunar-program-outlives-two-changes-of-backer"
probability = { baseline = 0.75, moderate = 0.8, strong = 0.85, radical = 0.9, open = 0.92 }
estimated_on = 2026-09-19
rationale = "With any nation's program counting and a restart still able to resolve it, the question is whether some crewed lunar program anywhere becomes an institution over forty-five years; two rival national programs and a flying commercial lander make that likely, and the longer windows add more attempts. Proposed with the rewording, 2026-09-19."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "US program only; a single cut before two administrations had passed resolved the node no for good", new = "any nation's or company's crewed lunar program; a cancelled program can be restarted and a different program can reach the mark", why = "First run (docs/runs/2026-09-19-first-run.md): as a Tier 1 requirement and a hard dependency of lunar material at scale, a permanent no from one US budget cut foreclosed an outpost by anyone. John ruled 2026-09-19 to reword to durable, nation-agnostic form." },
  { date = 2026-09-19, field = "probability", old = "0.60 flat across scenarios", new = "0.75 / 0.80 / 0.85 / 0.90 / 0.92", why = "Re-estimated against the reworded criterion, which can resolve later and by more programs; no longer flat because the longer windows now add attempts." },
  { date = 2026-09-19, field = "resolution", old = "'for the US program, counting from 2026, that means two successive presidential administrations after the current one'; 'change of government' undefined", new = "the counting-from-2026 sentence dropped; a change of government means a change in the head of government, or for a company program in its anchor customer's government", why = "Step 27 outside-model review, item 84 (docs/reviews/2026-09-19-rulings.md): the 2026 sentence assumed crew first flew in 2026 and could contradict the general clause if the first crewed flight slips, and non-democracies needed a definition. Ruled by John 2026-09-19." },
  { date = 2026-09-25, field = "description", old = "'counts, because Tier 1 is an outpost by anyone'", new = "'counts, because lunar material at scale can come from anyone's program ... It gates the Slow Expanse through lunar material at scale.'", why = "Methodology pass item 97 (docs/methodology-pass-2026-09-25.md), ruled by John 2026-09-25: Tier 1 is now tested by the hundred-workers node alone, so this node no longer feeds Tier 1 directly; it still gates Tier 3 through L-lunar-material-delivered-to-orbit-at-scale. Text only; no number changed." },
  { date = 2026-09-25, field = "status", old = "open", new = "superseded by R-crewed-lunar-program-outlives-two-changes-of-backer", why = "Candidate 3 of docs/proposal-function-over-route-2026-09-25.md, approved by John 2026-09-25: the criterion widens to a program, government or commercial, that outlives two changes of its principal backer. This node's numbers were published, so it is retired and replaced rather than renamed (docs/methodology.md, 'What is fixed and what moves'); lunar material at scale now depends on the replacement." },
]

[[node]]
id = "R-crewed-lunar-program-outlives-two-changes-of-backer"
name = "A crewed lunar program, government or commercial, keeps flying across two changes of its principal backer"
factor = "R"
kind = "world"
description = """
Every large space program since Apollo has been redrawn or cancelled when the people paying
for it changed: a new administration for a government program, a new owner or lead funder
for a company's. A program that keeps its money and keeps flying crewed hardware across two
such changes has become an institution rather than one backer's project, which is what a
multi-decade build on the Moon needs. Any nation's or company's crewed lunar program counts,
because lunar material at scale can come from anyone's program; the US program is the one to
watch first. It gates the Slow Expanse through lunar material at scale."""
resolution = """
A crewed lunar program, government or commercial, receives its funding and flies crewed
hardware under each of two successive principal backers after the one backing it when it
first flew crew. The principal backer is whoever supplies the largest share of the program's
money: for a government program, or a company program whose largest customer is a
government, a change of backer is a change in that government's head of government; for a
company program funded mainly by private money, it is a change in which private party
supplies the largest share (a new controlling owner or a new lead funder). A program that is
cancelled and later restarted, or a different program that reaches the mark, resolves the
node when it gets there."""
source = "The funding government's budget records or the company's public filings, and the program's flight record"
horizon = "mid"
depends_on = []
status = "open"
probability = { baseline = 0.78, moderate = 0.82, strong = 0.87, radical = 0.91, open = 0.93 }
estimated_on = 2026-09-25
rationale = "Re-estimated 2026-09-25 against the widened criterion, proposed by Claude and not yet ruled by John. The government route carries almost all of it, as it did at 0.75 by 2071: two rival national programs and forty-five years make it likely some crewed lunar program becomes an institution. The commercial route adds a little, since a company program whose owner or lead funder changes twice and keeps flying crew also counts now, but a founder-funded program can fly for decades without a change of backer, so it adds attempts rather than certainty."
notes = "Added 2026-09-25 as the replacement for R-crewed-lunar-program-outlives-two-changes-of-president under candidate 3 of docs/proposal-function-over-route-2026-09-25.md, approved by John 2026-09-25. What lunar material at scale takes from this step is a lunar program that lasts, and a commercial program that outlives its backers supplies that as well as a government one. The old node carried published numbers, so under docs/methodology.md it is retired and replaced rather than renamed in place; its record is kept."

[[node]]
id = "R-space-funding-holds-through-a-recession"
name = "Space spending recovers within three years of the next recession"
factor = "R"
kind = "world"
description = """
Downturns are when long builds get cut. The test is whether, after the next US recession,
the government's exploration and space-operations budget and the largest private launch
company's flight rate come back to where they were rather than being cut and left there. A
dip is allowed; what the tree needs is that the field keeps its funding across the business
cycle. The node looks forward: the 2008 and 2020 downturns are the reason the number is
high, not the event it waits for. It is tested at every recession that ends after
2026-09-19 and resolves yes the first time the field comes through one."""
resolution = """
Within three calendar years after the end of the first US recession that ends after
2026-09-19, as dated by the National Bureau of Economic Research, or of any later recession
if that one fails the test: the sum of NASA's Exploration and Space Operations appropriations
for a fiscal year equals or exceeds the highest annual total of that sum in the three fiscal
years before the recession began, in nominal dollars, and the yearly orbital launch count of
the US provider that flew the most orbital launches in the last full calendar year before the
recession began equals or exceeds that provider's highest annual count in the three calendar
years before the recession began. Resolves yes at the first recession that passes both
tests; a recession that fails leaves the node open for the next."""
source = "NBER recession dates, the enacted NASA appropriations for the Exploration and Space Operations accounts, and public orbital launch logs"
horizon = "mid"
depends_on = []
status = "open"
probability = { baseline = 0.8, moderate = 0.82, strong = 0.85, radical = 0.9, open = 0.9 }
estimated_on = 2026-09-19
rationale = "The 2008 and 2020 downturns both saw space budgets and launch counts recover within three years, and the private flight rate is carried by constellation customers; the residual is a downturn deep enough to restructure the field. Rises slowly because every added recession is another chance to pass. Numbers stand under the forward-looking reword of 2026-09-19, which already priced a future recession."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "budget and launch count must not fall more than ten percent during the recession year itself; a fail was permanent", new = "budget and launch count are back within ten percent within three years after the recession; a fail leaves the node open for the next recession", why = "First run (docs/runs/2026-09-19-first-run.md): as a hard dependency of a hundred people working off Earth, a permanent no from one bad budget year foreclosed that node in every later decade. John ruled 2026-09-19 to reword to durable form." },
  { date = 2026-09-19, field = "probability", old = "0.55 flat across scenarios", new = "0.80 / 0.82 / 0.85 / 0.90 / 0.90", why = "Re-estimated against the reworded criterion; recovery within three years is a much easier test than no dip at all, and later recessions add chances." },
  { date = 2026-09-19, field = "resolution", old = "any US recession, no start date, so the 2020 recession counted; 'within ten percent of its pre-recession level in real terms', basket and provider unspecified", new = "the first US recession that ends after 2026-09-19 (structural: the criterion changed after estimation); recovery means equalling or exceeding the highest annual total of the three pre-recession years, in nominal dollars; the basket is NASA's Exploration and Space Operations accounts; the provider is the US provider with the most orbital launches in the last pre-recession year", why = "Step 27 outside-model review, items 23, 88 and 89 (docs/reviews/2026-09-19-rulings.md): on the plain reading the node had already resolved on the 2020 recession (budget about 102 percent of 2019 on Astra's basket; launches 13 in 2019 and 31 in 2021, which the 'within ten percent' band perversely failed); John chose option (b), reword to the next recession with the floor and the fixed basket, keep it open, numbers stand, logged as structure, so the node keeps guarding the hundred-workers node against the next downturn. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "name", old = "Space spending recovers within three years of a recession", new = "Space spending recovers within three years of the next recession", why = "Step 27 outside-model review, item 89: the name now says the node looks forward. Ruled by John 2026-09-19." },
]

[[node]]
id = "R-binding-ban-on-debris-creating-anti-satellite-tests"
name = "The major space powers are bound by a ban on debris-creating anti-satellite tests"
factor = "R"
kind = "world"
description = """
A single war in orbit, or even one more test that shatters a satellite, could make low
orbit unusable for decades and stop everything above it. A binding agreement among the
powers that can do it is the clearest sign that orbit is being treated as shared
infrastructure rather than a battlefield."""
resolution = """
The United States, China, and Russia are all party to a legally binding agreement
prohibiting anti-satellite tests that create orbital debris, and the agreement is in force."""
source = "The treaty text and the depositary's record of parties"
horizon = "mid"
depends_on = []
status = "open"
probability = { baseline = 0.3, moderate = 0.4, strong = 0.55, radical = 0.75, open = 0.8 }
estimated_on = 2026-09-19
rationale = "Unilateral pledges exist, a binding three-party treaty does not; it needs either a scare in orbit or a detente, and Russia is the holdout."
notes = "Required by Tier 4 from 2026-09-08 to 2026-09-25. Removed from Tier 4 under methodology pass item 100 part (a) (docs/methodology-pass-2026-09-25.md), ruled by John 2026-09-25: a treaty is a sign that orbit is treated as shared, not a condition a Full Expanse cannot exist without. Kept in the tree as a tracked event that gates no tier, on the precedent of E-megawatt-heat-rejected-for-thirty-days-in-vacuum."
revisions = [
  { date = 2026-09-25, field = "notes", old = "", new = "the node's removal from Tier 4 and its place as a tracked event that gates no tier", why = "Methodology pass item 100 part (a), ruled by John 2026-09-25. The node record's own fields are unchanged; tier membership lives in data/tiers.toml." },
]

[[node]]
id = "R-off-earth-resource-rights-recognised-by-major-powers"
name = "The United States and China both recognise the same rules for owning what is mined off Earth"
factor = "R"
kind = "world"
description = """
Nobody will spend a decade building a mine on the Moon if another power can call the
ore stolen. A common framework for who may extract and own off-Earth resources, whether a
treaty or matching national laws, is what lets the motive nodes attract long money."""
resolution = """
A treaty in force, or national laws whose provisions mutually recognise each other, gives
the United States and China (and at least one of the European Union, India, or Russia) the
same rules on ownership of extracted material, its transfer, and the settlement of disputes
at off-Earth sites, as documented in the treaty record or the enacted statutes."""
source = "The treaty record or the enacted statutes"
horizon = "root"
depends_on = []
status = "open"
probability = { baseline = 0.45, moderate = 0.55, strong = 0.7, radical = 0.85, open = 0.9 }
estimated_on = 2026-09-19
rationale = "Two rival frameworks today; convergence usually follows the first real mine. An outside model's 70 percent by 2070 (Astra, 2026-09-19) was for transferable rights among major jurisdictions without requiring the United States and China to match."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "'the same rules for extracting and owning resources', rights unlisted", new = "the same rules on ownership of extracted material, its transfer, and the settlement of disputes", why = "Step 27 outside-model review, item 85 (docs/reviews/2026-09-19-rulings.md): 'same rules' could mean identical statutes or merely compatible rights; naming the three rights is a cheap clarification still measurable from statute text. Ruled by John 2026-09-19." },
]

[[node]]
id = "R-off-earth-site-accepts-permanent-residents"
name = "An off-Earth site accepts people as permanent residents"
factor = "R"
kind = "world"
description = """
What separates living off Earth (the A3 tier) from working there on rotation (A2). Early
settlements may be work camps by policy for decades, with every person on a return
schedule, even after the biology allows staying. The node resolves when some site publishes
a resident status that lets a person stay indefinitely by choice, and someone has actually
lived there under it for years. Choosing to stay is John's decision, not the world's, and
belongs with the choice points once the access branch firms up."""
resolution = """
Under a published resident status at an off-Earth site that permits voluntary indefinite
residence, at least one person has lived there continuously for three years holding that
status, without a mandatory rotation date and not because departure was delayed or
impossible, confirmed by the operator or governing body."""
source = "The site's published residence terms and the operator's or governing body's record"
horizon = "root"
depends_on = ["B-long-term-off-earth-living-by-some-route"]
status = "open"
probability = { baseline = 0.6, moderate = 0.7, strong = 0.82, radical = 0.92, open = 0.95 }
estimated_on = 2026-09-19
rationale = "Once the biology allows it, the rule is a liability and policy question, and one permissive site anywhere resolves it; work-camp terms at every operator at once are less likely to persist for decades than the first estimate assumed."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "'with no scheduled return to Earth', which proves a negative and could describe stranded crew", new = "a published resident status that permits voluntary indefinite residence, held by at least one person living there continuously for three years", why = "Step 27 outside-model review, items 24 and 86 (docs/reviews/2026-09-19-rulings.md): a positive status test in place of a negative, with 'voluntary' ruling out the stranded case; the name loses 'with no return scheduled' to match. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "probability", old = "0.50 / 0.60 / 0.75 / 0.90 / 0.93", new = "0.60 / 0.70 / 0.82 / 0.92 / 0.95", why = "Step 27 outside-model review, item 87 (docs/reviews/2026-09-19-rulings.md): the first rationale was a claim about every operator at once, and one permissive site resolves the node; moved partway. Gates A3 only. Ruled by John 2026-09-19." },
]
notes = "Added 2026-09-08 (agreed by John) so that A3 has a node distinguishing it from A2. Placed under regime because permanent residence is a rule somebody sets, not a technology."

[[node]]
id = "R-us-and-china-recognise-keep-out-zones-around-off-earth-installations"
name = "The United States and China recognise each other's keep-out zones around off-Earth installations"
factor = "R"
kind = "world"
description = """
Nobody will run a mine or a plant on the Moon if a rival can land next to it. The Artemis
Accords already describe "safety zones" around surface operations, recognised by one bloc;
China's programme has its own partners and its own rules. Mutual, formal recognition by the
two powers that will actually be there of each other's right to keep others out of a zone
around an installation is the piece of law a product sold at a profit from out there stands
on, and it is distinct from who owns what is dug up."""
resolution = """
The United States and China are each party to an instrument (a treaty, a bilateral or
multilateral agreement, or matching enacted laws that name each other) under which each
formally recognises the other's right to declare and enforce keep-out or safety zones around
its off-Earth surface installations, as documented in the treaty record or the enacted text."""
source = "The treaty record or the enacted statutes"
horizon = "mid"
depends_on = []
status = "open"
probability = { baseline = 0.5, moderate = 0.6, strong = 0.72, radical = 0.85, open = 0.9 }
estimated_on = 2026-09-20
rationale = "One bloc already practises safety zones and the other will need them the day it has an installation to protect, so the incentive runs both ways; what holds it at even odds by 2071 is that formal mutual recognition between these two powers on anything has been rare for a decade, and a tacit arrangement would not resolve the node. Proposed by Claude 2026-09-20 with the node's addition, accepted by John."
notes = "Added 2026-09-20 under step 27, item 19 (docs/reviews/2026-09-19-rulings.md, ruled 2026-09-19): raised by Gemini as a missing node; a dependency of M-off-earth-product-sold-at-a-profit (see item 80). Distinct from R-off-earth-resource-rights-recognised-by-major-powers, which is about ownership of extracted material."

[[node]]
id = "R-space-traffic-management-authority-among-major-powers"
name = "A space traffic authority among the major powers can enforce rules on manoeuvres and launch windows"
factor = "R"
kind = "world"
description = """
Air traffic has controllers with authority; space traffic has voluntary conjunction
warnings and a great deal of goodwill. Tens of thousands of people in transit, thousands of
vehicles and a Belt worth of shipping need an authority among the powers that fly, with
real enforcement over who manoeuvres where and who launches when. It is distinct from a ban
on debris-creating weapons tests and is the regime the Slow Expanse assumes without saying."""
resolution = """
A body established by agreement among at least the United States and China, and at least
one of the European Union, India, or Russia, holds and has exercised authority over
spacecraft manoeuvres and launch windows, with a published enforcement record (a refused
launch window, a directed manoeuvre, or a sanction under the agreement), as documented in
the agreement's text and the body's own published record."""
source = "The agreement's text and the body's published enforcement record"
horizon = "root"
depends_on = []
status = "open"
probability = { baseline = 0.35, moderate = 0.45, strong = 0.6, radical = 0.78, open = 0.85 }
estimated_on = 2026-09-20
rationale = "Coordination bodies without teeth exist and traffic in low orbit is already forcing the question, but an authority with enforcement over the major powers' own launches is a cession of sovereignty that took aviation a world war to reach; a little over one in three by 2071 and likely only with the longer windows. Proposed by Claude 2026-09-20 with the node's addition, accepted by John."
notes = "Added 2026-09-20 under step 27, item 20 (docs/reviews/2026-09-19-rulings.md, ruled 2026-09-19): raised by Gemini as a missing node; required by Tier 3 (data/tiers.toml). Moving it to Tier 4 in place of the anti-satellite ban was proposed at the methodology pass (item 100 part b, docs/methodology-pass-2026-09-25.md) and declined by John 2026-09-25; it stays in Tier 3."
revisions = [
  { date = 2026-09-25, field = "notes", old = "'with the Tier 4 alternative to be revisited at the methodology pass alongside item 100'", new = "the Tier 4 alternative considered at the methodology pass and declined; stays in Tier 3", why = "Methodology pass item 100 (docs/methodology-pass-2026-09-25.md), part (b) declined by John 2026-09-25. Notes only; no number or tier list changed for this node." },
]
