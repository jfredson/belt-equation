# Nodes under the window factor (W): that John is alive on the date in question. These nodes are
# about longevity research in general, never about his health. They are what would make the
# moderate, strong, and open scenarios real rather than hypothetical. Record layout:
# docs/node-schema.md. Drafted 2026-09-08 in the first brainstorm session; no probabilities yet.
# Dependencies on nodes in other factors are noted in `notes` and drawn at roadmap step 7.

[[node]]
id = "W-dog-rapamycin-trial-reports-longer-life"
name = "The large dog trial of rapamycin reports that treated dogs live measurably longer"
factor = "W"
kind = "world"
description = """
The Dog Aging Project's TRIAD trial gives rapamycin, the best-studied life-extending drug in
mice, to hundreds of pet dogs in a placebo-controlled design and follows them for years. It is
the first lifespan trial of an aging drug in a large mammal living in ordinary conditions, and
its result is due within a few years. A positive result is the single strongest near-term
signal that mouse longevity results carry over to animals like us."""
resolution = """
The trial's primary lifespan analysis, published in a peer-reviewed journal, reports a
statistically significant increase in lifespan for the rapamycin group over placebo."""
source = "The Dog Aging Project's published TRIAD results"
horizon = "leaf"
depends_on = []
status = "open"
probability = { baseline = 0.45, moderate = 0.45, strong = 0.45, radical = 0.45, open = 0.45 }
estimated_on = 2026-09-08
rationale = "One trial, one readout around 2031: the mouse evidence is strong and a dog pilot showed heart benefits, but lifespan trials fail more often than they succeed, so a little under even; the same in every scenario because the window does not change when the trial reports."

[[node]]
id = "W-regulator-accepts-aging-as-an-indication"
name = "A major drug regulator accepts slowing aging as something a drug can be approved for"
factor = "W"
kind = "world"
description = """
Today a drug must target a named disease. There is no approvable indication for slowing aging
itself, which is why aging drugs are tested against single diseases and why companies avoid the
field. In 2015 the US regulator agreed that one trial could use a composite of age-related
diseases as its primary endpoint, which is the precedent; what does not yet exist is guidance
saying a drug can be approved, and labelled, for slowing aging. That is what changes what gets
funded and trialed."""
resolution = """
The US Food and Drug Administration or the European Medicines Agency publishes guidance
stating that slowing aging, extending healthy lifespan, or delaying a composite of age-related
diseases is an indication for which a drug can be approved and labelled. Accepting such a
composite as a trial endpoint, which the US regulator did in 2015, does not count."""
source = "The regulator's own published guidance"
horizon = "leaf"
depends_on = []
status = "open"
probability = { baseline = 0.55, moderate = 0.6, strong = 0.7, radical = 0.85, open = 0.9 }
estimated_on = 2026-09-08
rationale = "The 2015 composite-endpoint precedent and a growing field make guidance within forty-five years somewhat more likely than not; every added decade of trials and lobbying raises it."
notes = "Checked 2026-09-08 against the trial's own design papers and the National Institute on Aging's page on regulator review of aging-related applications: the regulator approved the trial's composite design and the trial 'holds the potential' to lead to aging being considered an indication, which confirms that no approvable indication exists yet."

[[node]]
id = "W-composite-aging-trial-positive-in-humans"
name = "A randomized human trial shows one drug delays several age-related diseases at once"
factor = "W"
kind = "world"
description = """
The Targeting Aging with Metformin trial and others like it test whether one cheap drug can
delay the arrival of heart disease, cancer, dementia, and death taken together in older adults.
A positive result is the first proof in humans that aging can be slowed as a whole rather than
one disease at a time."""
resolution = """
A randomized, placebo-controlled trial of at least a thousand older adults reports a
statistically significant delay in a combined measure, fixed before the trial began, of
several age-related diseases or death (a pre-registered composite endpoint), published in
a peer-reviewed journal."""
source = "The trial's peer-reviewed primary publication and its pre-registration record"
horizon = "mid"
depends_on = []
status = "open"
probability = { baseline = 0.7, moderate = 0.75, strong = 0.8, radical = 0.9, open = 0.9 }
estimated_on = 2026-09-08
rationale = "The metformin trial alone is perhaps two in five to report positive around 2031, but a dozen other composite trials over the following decades make at least one success likely."
notes = "Checked twice on 2026-09-08: no primary results publication for the Targeting Aging with Metformin trial (about 3,000 adults aged 65 to 79, four years, composite of heart disease, cancer, dementia, and death) was found in journal, registry, or sponsor sources; aggregator sites claiming a positive result are unconfirmed. Stays open. Re-check at the first quarterly scan."

[[node]]
id = "W-partial-reprogramming-reaches-human-trials"
name = "A cell-rejuvenation treatment based on partial reprogramming is given to people in a registered trial"
factor = "W"
kind = "world"
description = """
Partial reprogramming turns back the age markers of cells by briefly switching on the genes
used to make stem cells, without erasing what the cell is. It has restored sight and extended
life in mice and is the most-funded route to actually reversing rather than slowing aging.
The first human trial is the point where it becomes a medicine rather than a lab result, and
it has happened: the first participant was dosed in June 2026, in a safety trial for two
causes of age-related vision loss."""
resolution = """
A registered clinical trial (on clinicaltrials.gov or an equivalent registry) doses at least
one human participant with a partial-reprogramming therapy, for any indication."""
source = "The trial registry entry and the sponsor's announcement of first dosing"
horizon = "leaf"
depends_on = []
status = "resolved-yes"
resolved_on = 2026-06-09
resolved_by = "Life Biosciences press release of 2026-06-09 announcing the first participant dosed in its Phase 1 trial of ER-100 (registry entry NCT07290244), with independent press coverage"
notes = "Drafted open on 2026-09-08 and found resolved the same evening when checked under the verification rule, before any probability was estimated."

[[node]]
id = "W-first-drug-approved-to-slow-aging"
name = "The first drug is approved whose purpose is to slow aging, not to treat one disease"
factor = "W"
kind = "world"
description = """
The point where slowing aging becomes ordinary medicine that a doctor can prescribe. This is
what moves the baseline scenario toward the moderate one for everyone, not only trial
participants."""
resolution = """
The US Food and Drug Administration or the European Medicines Agency approves a treatment
whose labeled indication is slowing aging, extending healthy lifespan, or delaying a composite
of age-related diseases."""
source = "The regulator's approval record and the product label"
horizon = "mid"
depends_on = ["W-regulator-accepts-aging-as-an-indication"]
status = "open"
probability = { baseline = 0.6, moderate = 0.65, strong = 0.75, radical = 0.9, open = 0.92 }
estimated_on = 2026-09-08
rationale = "Given a regulator has opened the door, a first approval follows within a decade or two more often than not; the gap to certainty is trials that fail on safety in the old."
notes = "Almost certainly also depends on a positive composite trial; whether that is a hard dependency is for step 7."

[[node]]
id = "W-human-therapy-cuts-death-rate-in-older-adults"
name = "A treatment is shown in a large trial to cut the death rate of older adults by at least a quarter"
factor = "W"
kind = "world"
description = """
The result that would make the moderate scenario (a window around 2080) the expected case
rather than a hope: a therapy that reduces all-cause mortality in people over sixty-five by a
quarter or more over the trial period. Nothing yet approved comes close; statins and blood
pressure drugs move single causes of death by smaller amounts."""
resolution = """
A randomized, placebo-controlled trial in adults aged sixty-five or over, followed for at least
five years, reports that deaths from any cause fell by twenty-five percent or more in the
treated group, published in a peer-reviewed journal and not later retracted."""
source = "The trial's peer-reviewed primary publication"
horizon = "root"
depends_on = []
status = "open"
probability = { baseline = 0.2, moderate = 0.25, strong = 0.35, radical = 0.6, open = 0.7 }
estimated_on = 2026-09-08
rationale = "A quarter off all deaths in the over-65s is beyond anything approved; one in five by 2071 reflects that reprogramming and combination therapies are real but unproven in humans."

[[node]]
id = "W-verified-human-lifespan-passes-122"
name = "Someone verifiably lives past 122, the longest human life on record"
factor = "W"
kind = "world"
description = """
Jeanne Calment's 122 years has stood since 1997 and no verified case has come within three
years of it since, which is the strongest evidence that current medicine moves average
lifespan but not maximum lifespan. A verified case beyond it is the first sign that the ceiling
has moved, which is what the strong and open scenarios need."""
resolution = """
A person's age at death, or current age while living, exceeds 122 years and 164 days, verified
by the Gerontology Research Group or an equivalent body with documentary evidence of birth."""
source = "Gerontology Research Group validated supercentenarian records"
horizon = "root"
depends_on = []
status = "open"
probability = { baseline = 0.05, moderate = 0.08, strong = 0.15, radical = 0.45, open = 0.6 }
estimated_on = 2026-09-08
rationale = "The record has stood since 1997 and late-life mortality has not moved; passing it needs a therapy that lowers that rate, so near-impossible by 2071 and better than a coin flip only in the 150-year scenario."
notes = "Checked 2026-09-08: the record is 122 years and 164 days (1997); the second-longest verified life is 119 years and 107 days (2022), just over three years short, and the third is 119 years and 97 days (1999)."
long_shot = true
mechanism = """
Someone born around 1905 to 1930 who has already reached 110 benefits from late-life medicine
that did not exist for Calment (better cardiac, infection, and fall care), and survives the
last few years at a mortality rate that today runs near fifty percent a year. Later, a person
who received an approved aging therapy in their sixties or seventies carries a slower rate of
decline into their hundreds."""
breaking_point = """
Annual mortality past 110 appears to plateau near fifty percent, so each further year is a coin
flip and 122 needs a run of a dozen heads; the record has not moved in almost thirty years
despite far more people reaching 100. Passing it by more than a year or two requires that some
intervention lower the late-life mortality rate itself, which nothing tested in humans has done."""
