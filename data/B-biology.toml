[[node]]
id = "B-crewed-spin-gravity-demonstration"
name = "A crew lives for a month in a spinning spacecraft that produces artificial gravity"
factor = "B"
kind = "world"
description = """
Artificial gravity by spinning has been proposed since the 1950s and never flown with people.
A month-long crewed demonstration at any useful gravity level settles the practical questions
(motion sickness, docking, structural behaviour) that keep it a paper idea, and is the first
step on the habitat route that sidesteps the partial-gravity question entirely."""
resolution = """
A crewed spacecraft or station module rotates to produce at least one-sixth of Earth's gravity
at the crew's living level for thirty continuous days, with the crew living in the rotating
section throughout, at a reported rotation rate of 6 revolutions per minute or less, with the
crew's health over the month reported by the operator, and the rotation confirmed by the
operator and independent tracking."""
source = "The operator's mission record, including its crew-health report, and independent orbital tracking"
horizon = "leaf"
depends_on = []
status = "open"
probability = { baseline = 0.7, moderate = 0.75, strong = 0.8, radical = 0.9, open = 0.92 }
estimated_on = 2026-09-08
rationale = "Proposed since the 1950s, never flown, but private station builders now plan it and the engineering is modest; the risk is that nobody funds a month-long test when partial gravity on the Moon is available instead."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "people aboard, any rotation rate, no health report", new = "the crew living in the rotating section throughout, at a reported rotation rate of 6 revolutions per minute or less, with crew health reported by the operator", why = "Step 27 outside-model review, items 6 and 41 (docs/reviews/2026-09-19-rulings.md): the demonstration has to prove people can live there, not only that the structure spins, and a station with a spinning module the crew visits would otherwise have counted; 6 rpm is the upper end of what the adaptation literature treats as tolerable. Ruled by John 2026-09-19." },
]

[[node]]
id = "B-earth-gravity-habitat-occupied-for-a-year"
name = "People live for a year in a spinning habitat with Earth-normal gravity"
factor = "B"
kind = "world"
description = """
The full version of the habitat route: a structure large enough (roughly a hundred metres or
more in radius, spinning about three times a minute) that its occupants feel Earth's gravity
and need far less adaptation than partial gravity asks of them. If partial gravity turns out
to be unlivable, this is the only route to a Belt, and it is the route some space futurists
prefer anyway."""
resolution = """
A rotating habitat produces between 0.9 and 1.1 of Earth's gravity at the level where the
crew live and is continuously occupied by at least ten people for twelve months, with no
occupant medically evacuated during the year, confirmed by the operator and independent
tracking."""
source = "The operator's records and independent orbital tracking"
horizon = "root"
depends_on = ["B-crewed-spin-gravity-demonstration", "L-large-structure-assembled-in-orbit"]
status = "open"
probability = { baseline = 0.35, moderate = 0.42, strong = 0.55, radical = 0.78, open = 0.85 }
estimated_on = 2026-09-19
rationale = "Given a spin demo and hundred-metre assembly, an Earth-gravity habitat for ten people is a deployment milestone rather than a breakthrough; what holds it near one in three by 2071 is motive, since the partial-gravity route may make it unnecessary, not difficulty, which the dependencies already carry."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "at least ninety percent of Earth's gravity, occupancy only", new = "0.9 to 1.1 of Earth's gravity at the level where the crew live, with no occupant medically evacuated during the year", why = "Step 27 outside-model review, item 42 (docs/reviews/2026-09-19-rulings.md): the one-sided bound let a 1.5 g habitat count, and the habitat route needed a health test so that the either-route hedge (item 48) means the same thing by either route. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "description", old = "need no adaptation at all", new = "need far less adaptation than partial gravity", why = "Step 27 outside-model review, item 42: rotation and head movements still cause motion effects at Earth-normal gravity. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "probability", old = "0.25 / 0.32 / 0.45 / 0.70 / 0.80", new = "0.35 / 0.42 / 0.55 / 0.78 / 0.85", why = "Step 27 outside-model review, item 43 (docs/reviews/2026-09-19-rulings.md): the first estimate carried the prerequisites' difficulty into the conditional a second time; the motive discount survives, the difficulty discount does not. Ruled by John 2026-09-19." },
]
notes = "Edge drawn at step 7 (2026-09-08): a habitat with Earth-normal gravity is a hundred-metre-class structure, so it needs orbital assembly to have been done at that scale. Step 27, item 48 (2026-09-19): the health clause added here is what makes B-long-term-off-earth-living-by-some-route mean the same minimum by either route; the hedge node itself is unchanged."

