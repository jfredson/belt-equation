# Nodes under the biology factor (B): that humans can live, and eventually reproduce, in partial
# gravity and deep-space radiation. Includes the rotating-habitat hedge: a spinning habitat with
# Earth-normal gravity sidesteps the partial-gravity question. Record layout: docs/node-schema.md.
# Drafted 2026-09-08 in the first brainstorm session; no probabilities yet. Dependencies on nodes
# in other factors (launch, energy) are noted in `notes` and drawn at roadmap step 7.

[[node]]
id = "B-mammal-born-and-weaned-in-partial-gravity"
name = "A mammal is conceived, born, and weaned in partial gravity"
factor = "B"
kind = "world"
description = """
Whether pregnancy and early development work in less than Earth's gravity is the biggest open
question in off-Earth biology and has never been tested end to end. Mice have flown in a
spinning enclosure on the space station that produces lunar or Martian gravity, so the
experiment is within reach. A live, weaned litter is the first evidence that a settlement,
rather than a work camp, is biologically possible."""
resolution = """
A peer-reviewed publication reports that a mammal was conceived, carried to term, born, and
weaned entirely at a sustained gravity level between one-sixth and one-half of Earth's,
whether in a centrifuge in orbit or on the Moon or Mars, with offspring surviving to weaning,
in an experiment run with a control group."""
source = "The peer-reviewed publication and the space agency's mission record"
horizon = "leaf"
depends_on = []
status = "open"
probability = { baseline = 0.8, moderate = 0.82, strong = 0.85, radical = 0.92, open = 0.95 }
estimated_on = 2026-09-08
rationale = "The centrifuge hardware exists and the experiment is cheap next to everything else in the tree; the risk is that partial-gravity gestation fails biologically, not that nobody tries. A failed attempt leaves the node open: another species, gravity level, or method can still resolve it."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "no control group required", new = "with a control group; any gravity in the range still counts", why = "Step 27 outside-model review, item 49 (docs/reviews/2026-09-19-rulings.md): a control group is standard and costs nothing; replication at a specific destination gravity was declined as a research programme rather than a leaf. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "rationale", old = "said a biological failure would resolve the node no", new = "a failed attempt leaves the node open", why = "Step 27 outside-model review, item 49: the rationale overstated the criterion, which names no single experiment. Ruled by John 2026-09-19." },
]

[[node]]
id = "B-human-year-in-partial-gravity-without-disqualifying-harm"
name = "A person lives a full year in partial gravity and comes home without disqualifying harm"
factor = "B"
kind = "world"
description = """
The longest stays off Earth are a year or more in free fall on the space station, where bone,
muscle, eye, and heart changes are well documented. Nobody has lived even a month in partial
gravity. A year on the Moon (or in a spinning facility set to lunar or Martian gravity) with
published health outcomes that would not bar a return trip is what a rotation of months,
the A2 tier, assumes."""
resolution = """
A person completes twelve continuous months at a sustained gravity level between one-sixth and
one-half of Earth's, and a peer-reviewed report of their health outcomes after return to Earth
finds no condition that the responsible agency's own standards would count as disqualifying
for a further mission without a medical waiver."""
source = "The peer-reviewed health report and the agency's crew-health standards"
horizon = "mid"
depends_on = []
depends_on_any = [["L-crew-lands-on-moon-in-reusable-lander", "B-crewed-spin-gravity-demonstration"]]
status = "open"
probability = { baseline = 0.45, moderate = 0.52, strong = 0.62, radical = 0.78, open = 0.85 }
estimated_on = 2026-09-19
rationale = "Given people on the Moon or a spin facility, the bar is one person at any gravity in the range under the agency's own standards, with repeated attempts and the most favourable gravity available; the first estimate's discount was mostly timing, not difficulty. Bone and eye effects in free fall are the warning, and the return-and-no-waiver clause keeps the bar honest."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "health outcomes judged at any time, with no mention of return or waivers", new = "outcomes after return to Earth, and fit for a further mission without a medical waiver", why = "Step 27 outside-model review, item 46 (docs/reviews/2026-09-19-rulings.md): the node's name says the person comes home, and agency standards can be waived. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "probability", old = "0.35 / 0.42 / 0.50 / 0.65 / 0.70", new = "0.45 / 0.52 / 0.62 / 0.78 / 0.85", why = "Step 27 outside-model review, item 47 (docs/reviews/2026-09-19-rulings.md): the conditional bar (one person, any gravity in the range, agency standards, repeated attempts) is permissive and the first rationale's discount was timing rather than difficulty; moved partway, with item 46 tightening the bar back somewhat. Ruled by John 2026-09-19." },
]
notes = "Edge drawn at step 7 (2026-09-08): a year in partial gravity needs either people on the Moon or a spinning facility; either route will do."

