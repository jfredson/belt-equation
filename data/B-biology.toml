[[node]]
id = "B-shielding-halves-deep-space-radiation-dose"
name = "A shielding system flown in space cuts the deep-space radiation dose to a crew by half"
factor = "B"
kind = "world"
description = """
Beyond Earth's magnetic field, galactic cosmic rays deliver a dose that puts a multi-year
mission near or past current career limits, and the heavy nuclei in that radiation are hard to
stop with thin walls. Passive routes (thick water or hydrogen-rich walls, regolith) and active
routes (superconducting magnetic shields) both exist on paper. A flown demonstration that
halves the dose makes rotations of months at an outer site a matter of engineering rather than
of accepting the risk."""
resolution = """
A shielding system flown beyond low Earth orbit is measured to reduce the dose equivalent
from deep-space radiation (the galactic cosmic rays that Earth's magnetic field otherwise
keeps out), including secondary particles, at a crew position inside an occupiable volume,
by fifty percent or more compared with the interior dose of a current pressure vessel (a
space-station or Orion-class hull), reported in a peer-reviewed publication."""
source = "The peer-reviewed flight measurement; the publication's measurement protocol (matched conditions, reference geometry, uncertainty, shield mass and coverage) is what settles whether the comparison is fair"
horizon = "mid"
depends_on = []
status = "open"
probability = { baseline = 0.5, moderate = 0.55, strong = 0.65, radical = 0.8, open = 0.85 }
estimated_on = 2026-09-08
rationale = "Thick water walls could do it today at a mass cost; halving the dose in a flown test within forty-five years is even odds because the passive route is expensive and the magnetic route waits on cheap superconductors."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "dose at the crew position compared with an undefined unshielded reference", new = "dose equivalent, including secondary particles, at a crew position inside an occupiable volume, compared with the interior of a current pressure vessel", why = "Step 27 outside-model review, items 5 and 51 (docs/reviews/2026-09-19-rulings.md): an ordinary hull's mass could otherwise satisfy the node, a thick shield around a dosimeter is not a crew cabin, and thin shields can raise the secondary-particle dose; the measurement protocol goes in the source note. Ruled by John 2026-09-19." },
]
notes = "The magnetic route depends on high-temperature superconductors at practical cost, an energy node; drawn at step 7."

[[node]]
id = "B-closed-loop-life-support-year-off-earth"
name = "A crew off Earth lives for a year with most of its food, water, and air recycled on site"
factor = "B"
kind = "world"
description = """
The space station recycles most of its water and makes its oxygen from that water, but every
calorie is shipped up. Ground experiments (a year-long sealed habitat in China) have closed
the food loop on Earth. Doing it off Earth for a year is what partial self-sufficiency, the
Tier 2 criterion, means in practice."""
resolution = """
A crew at a site off Earth completes twelve continuous months during which more than half of
their calories are grown on site and more than ninety-five percent of water and oxygen are
recycled, as reported in the operating agency's or company's published accounting, which
states the calorie, water, and oxygen figures separately and includes starting stocks,
resupply, and emergency inputs."""
source = "The operator's published life-support accounting"
horizon = "mid"
depends_on = ["B-staple-crop-grown-from-seed-to-harvest-off-earth"]
status = "open"
probability = { baseline = 0.35, moderate = 0.45, strong = 0.6, radical = 0.85, open = 0.92 }
estimated_on = 2026-09-19
rationale = "Done on the ground for a year at 98 percent closure; off Earth, shipping food is cheap and farming is a settlement-scale project that needs volume and a reason, so a third by 2071 even given a staple crop harvested there; the long windows are where a settlement has to grow its own."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "percentages as reported by the operator, with no requirement to separate the figures or count starting stocks", new = "the operator's published accounting must state the calorie, water and oxygen figures separately and include starting stocks, resupply and emergency inputs", why = "Step 27 outside-model review, item 40 (docs/reviews/2026-09-19-rulings.md): percentages can hide imported stocks and accounting conventions; an independent audit was dropped as something that does not exist. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "depends_on", old = "none", new = "B-staple-crop-grown-from-seed-to-harvest-off-earth", why = "Step 27 outside-model review, item 3 (docs/reviews/2026-09-19-rulings.md): calories have never been grown off Earth, and a staple crop from seed to harvest is a cheap leaf this node needs. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "probability", old = "0.50 / 0.58 / 0.70 / 0.85 / 0.90", new = "0.35 / 0.45 / 0.60 / 0.85 / 0.92", why = "Step 27 outside-model review, item 7 (docs/reviews/2026-09-19-rulings.md): shipping food is cheap and farming is a settlement-scale project; moved partway toward the reviewer. Ruled by John 2026-09-19." },
]

[[node]]
id = "B-radiation-resistance-treatment-for-humans"
name = "A treatment is approved that makes people substantially more resistant to chronic space radiation"
factor = "B"
kind = "world"
description = """
The long shot on the biology side: rather than stopping the radiation, change the person.
Some organisms shrug off doses that would kill us, and a few of the responsible genes and
proteins are known. A drug or gene therapy that halves the long-term cancer and tissue damage
from chronic cosmic-ray exposure would loosen the mission limits that shielding otherwise has
to meet."""
resolution = """
A drug or gene therapy is approved by a major regulator, or adopted by a space agency's
crew-health standard, with evidence, to the standard that body applies, that it reduces the
lifetime cancer risk, or an equivalent long-term harm measure named in the approval, from
chronic galactic-cosmic-ray-type exposure by half or more."""
source = "The regulator's approval record or the agency's published crew-health standard"
horizon = "root"
depends_on = []
status = "open"
probability = { baseline = 0.08, moderate = 0.1, strong = 0.15, radical = 0.35, open = 0.45 }
estimated_on = 2026-09-08
rationale = "A preventive therapy for a rare exposure faces an approval bar no current evidence meets, and the biology of chronic heavy-ion harm is not understood; a long shot that only becomes plausible over a century."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "reduces the long-term harm by half or more, outcome unnamed", new = "reduces the lifetime cancer risk, or an equivalent long-term harm measure named in the approval, by half or more; the evidence standard stays with the approving body", why = "Step 27 outside-model review, item 50 (docs/reviews/2026-09-19-rulings.md): the outcome behind the fifty percent claim was undefined; the evidence standard is rightly delegated to the regulator or agency for a long shot. Ruled by John 2026-09-19." },
]
long_shot = true
mechanism = """
Radioprotective drugs already exist for acute exposure (amifostine protects tissue during
radiotherapy). Proteins from radiation-tolerant organisms, such as the tardigrade's Dsup, have
reduced DNA damage in human cells in the lab, and gene therapies that deliver a single protein
are now routine medicine. The step is from lab cells to a therapy shown to cut lifetime cancer
risk from chronic heavy-ion exposure, tested first in animals on the station or the Moon."""
breaking_point = """
Nobody knows whether the harm from years of heavy-ion exposure comes mostly from DNA damage,
which such proteins address, or from other tissue and vascular effects that they do not.
There is no human data on chronic heavy-ion exposure at all, and a preventive therapy given to
healthy people for a rare exposure faces an approval bar that no current evidence could meet."""

[[node]]
id = "B-staple-crop-grown-from-seed-to-harvest-off-earth"
name = "A staple crop is grown from seed to harvest off Earth"
factor = "B"
kind = "world"
description = """
Leafy greens have been grown and eaten on the space station; calories have not. Wheat, potato,
or rice grown from seed to a harvest worth eating, off Earth, is the first evidence that a
site can feed itself rather than garnish shipped food, and it is a cheap, near-term step that
the year of recycled food, water, and air under the settlement tier needs. Small numbers of
seeds have completed a life cycle in orbit; a harvest is the next thing."""
resolution = """
At a site off Earth (a station, the Moon, Mars, or a spacecraft), a staple crop (wheat, rice,
potato, or another crop grown for its calories) is grown from seed or tuber to a harvest of at
least one kilogram of edible dry grain or tuber, reported by the operating agency or company
or in a peer-reviewed publication. A few plants brought to seed for a life-cycle experiment do
not count; the harvest does."""
source = "The operating agency's or company's report, or the peer-reviewed publication"
horizon = "leaf"
depends_on = []
status = "open"
probability = { baseline = 0.75, moderate = 0.82, strong = 0.9, radical = 0.95, open = 0.96 }
estimated_on = 2026-09-20
rationale = "Rice and wheat have completed life cycles in orbit at experiment scale and every lunar and Mars base plan includes a greenhouse, so a kilogram harvest within forty-five years is likely; the residual is that nobody bothers while shipping food stays cheap. Proposed by Claude 2026-09-20 with the node's addition, accepted by John."
verify = ["Rice completed a full seed-to-seed life cycle aboard China's Tiangong station in 2022 (about 120 days), as reported by the Chinese Academy of Sciences; written from memory, to be checked and linked at the next scan."]
notes = "Added 2026-09-20 under step 27, item 3 (docs/reviews/2026-09-19-rulings.md, ruled 2026-09-19): raised by Gemini as a missing node; a hard dependency of B-closed-loop-life-support-year-off-earth. Astra's twenty-percent-of-calories node (item 39) was declined as covered by the closed-loop node, with this leaf filling the earlier-rung slot. The one-kilogram floor is there so that a life-cycle experiment with a few plants does not resolve a node about calories."

[[node]]
id = "B-major-operation-under-anaesthesia-performed-off-earth"
name = "A major operation under anaesthesia is performed off Earth and the patient survives"
factor = "B"
kind = "world"
description = """
A settlement of thousands cannot evacuate every appendix. Nobody has been operated on off
Earth; medical care there stops at what a crew member with training can do with a kit, and
serious cases come home. The first major operation under general or regional anaesthesia,
performed off Earth with the patient surviving, is the point at which people can be sick out
there the way people are sick anywhere, which a settlement, the Tier 2 bar, assumes."""
resolution = """
A surgical operation that opens a body cavity or otherwise requires general or regional
anaesthesia is performed on a person at a site off Earth, and the patient survives to
discharge or to return to Earth, confirmed by the operating agency or company or in a
peer-reviewed report. Minor procedures under local anaesthetic do not count."""
source = "The operating agency's or company's record, or the peer-reviewed case report"
horizon = "mid"
depends_on = []
status = "open"
probability = { baseline = 0.45, moderate = 0.55, strong = 0.7, radical = 0.88, open = 0.92 }
estimated_on = 2026-09-20
rationale = "Surgery happens when someone needs it and cannot be sent home, which takes a population in the hundreds at sites more than a few days from Earth; that is a Tier 1 world, so under even odds by 2071 and likely once a settlement exists. Proposed by Claude 2026-09-20 with the node's addition, accepted by John."
notes = "Added 2026-09-20 under step 27, item 2 (docs/reviews/2026-09-19-rulings.md, ruled 2026-09-19): raised by Gemini as a missing node; a Tier 2 requirement (data/tiers.toml). No hard dependency is drawn: an emergency can force the first operation at an outpost before any other node resolves."
