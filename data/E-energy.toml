  { date = 2026-09-19, field = "resolved_links", old = "the announcement and trade press only", new = "the Chelan County hearing-examiner index for 2025 added, for the conditional-use decision of 2025-10-14", why = "Step 27 outside-model review, item 63 (docs/reviews/2026-09-19-rulings.md): the criterion's confirmation is two-part (announcement and permitting record) and only the announcement was linked; resolved_on stays 2025-07-30 on the announcement, the permit date is recorded and marked verify until the county link is opened. Ruled by John 2026-09-19." },
