# Nodes under the energy factor (E): that cheap, abundant power exists off Earth, from fusion
# or an equivalent. Energy and drive are kept separate on purpose (definitions.md): a working
# power plant on the ground does not give you a rocket. Record layout: docs/node-schema.md.
# Drafted 2026-09-08 in the second brainstorm session. No probabilities yet.

[[node]]
id = "E-megawatt-spacecraft-operates-in-orbit"
name = "A single spacecraft generates and uses a megawatt of electricity in orbit"
factor = "E"
kind = "world"
description = """
The space station, the largest thing ever flown, makes about a tenth of a megawatt. Orbital
data centres, large electric tugs, and any industrial process in space start at a megawatt.
Several companies plan megawatt-class solar spacecraft within a few years, so this is the
near-term marker that power in space is scaling."""
resolution = """
One spacecraft in orbit generates and consumes at least one megawatt of electrical power
continuously for thirty days, confirmed by the operator and consistent with independent
observation of the vehicle."""
source = "The operator's records and independent observation"
horizon = "leaf"
depends_on = []
status = "open"

[[node]]
id = "E-fission-reactor-runs-on-lunar-surface"
name = "A nuclear reactor runs on the lunar surface for a year"
factor = "E"
kind = "world"
description = """
A lunar night lasts two weeks, so any permanent base needs power that does not come from the
Sun. A small fission reactor of a few tens of kilowatts is the planned answer; the US program
aimed at the end of this decade and, as of 2026, plans delivery of a reactor to the launch pad
in the early 2030s. It is the power source that mining, refining, and a permanent outpost
assume."""
resolution = """
A fission reactor delivering at least forty kilowatts of electricity operates on the lunar
surface for twelve continuous months, confirmed by the responsible agency's mission record."""
source = "The responsible agency's mission record"
horizon = "mid"
depends_on = []
status = "open"
notes = "Drafted as a leaf; moved to mid on 2026-09-08 after checking the program's schedule, which has slipped to the early 2030s."

[[node]]
id = "E-superconducting-wire-price-falls-tenfold"
name = "High-temperature superconducting wire costs a tenth of what it does today"
factor = "E"
kind = "world"
description = """
The strong, light magnets that compact fusion, magnetic radiation shielding, and some drive
concepts all need are made of high-temperature superconducting tape, and its price is what
keeps those magnets rare. A tenfold fall from the 2026 price puts a fusion plant's magnets, or
a shield around a crew cabin, within an ordinary project budget. This node feeds nodes in
biology and drive as well as fusion."""
resolution = """
Published price lists or public procurement records show high-temperature superconducting
tape sold in production quantities at one tenth or less of its 2026 price per kiloamp-metre,
adjusted for inflation."""
source = "Vendor price lists and public procurement or agency cost reports"
horizon = "mid"
depends_on = []
status = "open"

[[node]]
id = "E-fusion-plant-delivers-net-electricity"
name = "A fusion power plant delivers net electricity to a grid"
factor = "E"
kind = "world"
description = """
The point where fusion stops being an experiment: a plant that puts more electricity onto a
grid than it draws, for long enough to count. Several private plants are scheduled to try
in the early 2030s. Fusion on the ground is the technology base that any fusion drive, and
any large off-Earth power plant that cannot rely on the Sun, would be built from."""
resolution = """
A fusion power plant exports net electrical energy to a public grid over a continuous period
of at least thirty days, with net export confirmed by the grid operator's metering."""
source = "The grid operator's metering record and the plant operator's report"
horizon = "mid"
depends_on = ["E-construction-begins-on-a-fusion-plant-meant-to-sell-electricity"]
status = "open"
notes = "Drafted with a hard dependency on cheap superconducting wire; removed at step 7 (2026-09-08) because only the magnet route needs it and laser and other routes do not. The link stays in the mechanism of the fusion drive node. Now depends on a plant having started construction, which has happened."

[[node]]
id = "E-construction-begins-on-a-fusion-plant-meant-to-sell-electricity"
name = "Construction begins on a fusion plant built to sell electricity to a customer"
factor = "E"
kind = "world"
description = """
The step before net electricity: someone breaks ground on a plant whose purpose is to sell
power, with a customer signed. It has happened. A company backed by a purchase agreement
with a large technology firm began building its first plant in Washington state in July
2025, aiming to deliver electricity in 2028. The node stays in, resolved, as the first rung
on the fusion ladder and a resolved leaf the calibration score can count."""
resolution = """
A company begins site construction of a fusion power plant that has a signed agreement to
sell electricity to a named customer, confirmed by the company's announcement and local
permitting records."""
source = "The company's announcement and the county's permitting record"
horizon = "leaf"
depends_on = []
status = "resolved-yes"
resolved_on = 2025-07-30
resolved_by = "Helion's announcement of 2025-07-30 that it had secured land and begun building at Malaga, Washington, under its power purchase agreement with Microsoft; reported by World Nuclear News and BusinessWire"
notes = "Added at step 7 (2026-09-08); the date and facts checked the same day against the company's newsroom and trade press."
