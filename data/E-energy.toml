[[node]]
id = "E-megawatt-heat-rejected-for-thirty-days-in-vacuum"
name = "A radiator system sheds a megawatt of waste heat in vacuum for thirty days"
factor = "E"
kind = "world"
description = """
In vacuum there is no air to carry heat away; everything a spacecraft does not radiate, it
keeps. Every megawatt-class spacecraft, reactor, or drive is limited by the size and mass of
the radiators that shed its waste heat, and no radiator flown to date handles more than a
fraction of a megawatt. A radiator that rejects a full megawatt for a month in space is the
binding constraint on megawatt spacecraft, tested on its own."""
resolution = """
A radiator system in space rejects at least one megawatt of thermal power, averaged over
thirty continuous days, as measured and reported by the operator from the system's own
coolant temperatures and flow, whether the heat comes from a reactor, a power converter, or
a test heat source."""
source = "The operator's flight test record"
horizon = "leaf"
depends_on = []
status = "open"
probability = { baseline = 0.8, moderate = 0.85, strong = 0.9, radical = 0.94, open = 0.95 }
estimated_on = 2026-09-20
