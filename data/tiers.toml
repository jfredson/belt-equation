# What "the Belt exists" and "Belter" mean, as sets of required nodes (definitions.md).
# requires: every listed node or lower tier must resolve. "Either route" logic lives on nodes
# (depends_on_any in docs/node-schema.md), not here, so this file stays a plain list.
# Node lists drawn at roadmap step 7, 2026-09-08. The prose is the definition the lists must satisfy.

[[system_tier]]
key = "T1"
name = "Outpost"
definition = "Permanent crewed presence at the Moon, Mars, or a permanently crewed station, hundreds of people, fully supplied from Earth."
requires = [
  "M-hundred-people-working-off-earth-for-pay",
]
# Methodology pass item 97 (docs/methodology-pass-2026-09-25.md), ruled by John 2026-09-25, the pass
# counting as the review that tier changes require: Tier 1 is location-agnostic, so its test is the
# location-agnostic headcount node alone and a crewed station counts. The three lunar nodes
# (reusable lander, surface reactor, lunar program) were Tier 1 requirements from 2026-09-08 to
# 2026-09-25; they still gate Tier 3 through L-lunar-material-delivered-to-orbit-at-scale, which
# depends on all three.

[[system_tier]]
key = "T2"
name = "Settlement"
definition = "Thousands living off Earth at one or more sites, partial local self-sufficiency in air, water, and food."
requires = [
  "T1",
  "L-launch-price-below-200-dollars-per-kg",
  "B-long-term-off-earth-living-by-some-route",
  "B-closed-loop-life-support-year-off-earth",
  "B-major-operation-under-anaesthesia-performed-off-earth",
]
# B-major-operation-under-anaesthesia-performed-off-earth added 2026-09-20 under step 27, item 2
# (docs/reviews/2026-09-19-rulings.md, ruled 2026-09-19): a settlement cannot evacuate every appendix.
# B-human-child-born-off-earth was a Tier 2 requirement until 2026-09-19, when John ruled it moved to
# Tier 4 after the first run showed it capping every tier above Tier 2 (docs/runs/2026-09-19-first-run.md).
# Tier 2's definition no longer names the child and Tier 4's does, so the words and the lists agree
# (methodology pass item 99, docs/methodology-pass-2026-09-25.md, ruled by John 2026-09-25).

[[system_tier]]
key = "T3"
name = "Slow Expanse"
definition = "Tens of thousands off Earth, including at least one site beyond the Earth-Moon system. Transit times in months. Something mined or made off Earth sold at a profit. Nuclear propulsion in routine use. This is the bar for the headline."
requires = [
  "T2",
  "D-permanent-crewed-site-beyond-the-earth-moon-system",
  "D-nuclear-propulsion-in-routine-use",
  "M-off-earth-product-sold-at-a-profit",
  "R-off-earth-resource-rights-recognised-by-major-powers",
  "B-shielding-halves-deep-space-radiation-dose",
  "L-lunar-material-delivered-to-orbit-at-scale",
  "R-space-traffic-management-authority-among-major-powers",
]
# R-space-traffic-management-authority-among-major-powers added 2026-09-20 under step 27, item 20
# (ruled 2026-09-19): a real gate on tens of thousands in transit. Moving it to Tier 4 in place of the
# anti-satellite ban was considered at the methodology pass (item 100 part b,
# docs/methodology-pass-2026-09-25.md) and declined by John 2026-09-25; it stays here.

[[system_tier]]
key = "T4"
name = "Full Expanse"
definition = "Millions off Earth, transit times in weeks on constant-acceleration drives, children born and raised off Earth, a Belt population with its own political identity and economy."
requires = [
  "T3",
  "D-constant-acceleration-drive-demonstrated",
  "B-human-child-born-off-earth",
]
# R-binding-ban-on-debris-creating-anti-satellite-tests was a Tier 4 requirement from 2026-09-08 to
# 2026-09-25. It left this list under methodology pass item 100 part (a), ruled by John 2026-09-25: a
# treaty is a sign that orbit is treated as shared, not a condition of a Full Expanse. The node stays
# in the tree as a tracked event that gates no tier, like the megawatt radiator node.

[[access_tier]]
key = "A0"
name = "Contributes from Earth"
definition = "Works in or for the off-world industry without leaving."
requires = ["A-working-in-or-for-the-off-earth-industry"]

[[access_tier]]
key = "A1"
name = "Has flown"
definition = "At least one trip to space, suborbital or orbital, as passenger or crew."
requires = ["A-first-spaceflight"]

[[access_tier]]
key = "A2"
name = "Works off Earth on rotation"
definition = "Months at a time living and working at an off-world site. The headline number."
requires = ["T3", "A-in-a-role-whose-holders-rotate-off-earth"]

[[access_tier]]
key = "A3"
name = "Lives off Earth"
definition = "Permanent residence at an off-world site. Reported beside the headline as the stretch. Requires A2 plus a site that accepts permanent residents; the choice to stay is a future choice point, not a world event."
requires = ["A2", "R-off-earth-site-accepts-permanent-residents"]
# Requiring A2 is a limit of the one route the access branch models (work a rotation, then stay), not
# of what living off Earth means; moving straight to an off-Earth site is another route. Recorded in
# docs/definitions.md under methodology pass item 96, ruled by John 2026-09-25; the list waits for the
# access-branch review after pipeline graduation (May 2027).
