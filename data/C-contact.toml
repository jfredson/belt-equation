# The Contact Clause (C): published beside the equation and never multiplied into it. No tier
# requires a C node; the compute script reports them in their own section. Rungs and criteria
# from definitions.md. Record layout: docs/node-schema.md. Drafted 2026-09-08 in the third
# brainstorm session. First probabilities 2026-09-19 (roadmap step 9, group three).

[[node]]
id = "C1"
name = "A non-human mind produces knowledge beyond us"
factor = "C"
kind = "world"
description = """
An artificial system originates a scientific or mathematical idea, not merely a search that
exhausts the cases: the key construction or proof idea comes from the system and not from
its operators, and the record says so. A brute-force proof that a solver ground out is a
tool's work; a construction nobody had thought of is a mind's. Plausibly already resolved
on machine-found mathematical constructions from 2023 to 2025 that beat the best human
ones; the weekly scan checks those against the wording before anything is settled."""
resolution = """
A result in mathematics or the natural sciences whose key construction or proof idea was
generated by a learning-based or search-based artificial intelligence system and not
specified by its operators, acknowledged as such in the peer-reviewed record, that is
verified by machine checking or by experiment and is acknowledged in that record as beyond
what human researchers had produced. An exhaustive case check or a satisfiability proof
whose idea was the operators' does not count."""
source = "The peer-reviewed record and the verification artefact"
horizon = "leaf"
depends_on = []
status = "open"
probability = { baseline = 0.95, moderate = 0.96, strong = 0.97, radical = 0.98, open = 0.98 }
estimated_on = 2026-09-20
rationale = "Re-estimated 2026-09-20 against the machine-originated-idea wording: at least two published results from 2023 to 2025 (a search-based system's new constructions for a long-open combinatorial problem, and a later system's improved matrix-multiplication and packing bounds) appear to meet it on their face, and the record in each case says the construction came from the system, so the remaining doubt is whether a scan finds the wording met in so many words. Proposed by Claude 2026-09-20, accepted by John."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "any result produced by an artificial system, machine-verified, acknowledged as beyond human researchers, and not checkable by hand (structural: the criterion changed after estimation)", new = "the result's key construction or proof idea was generated by a learning- or search-based AI system and not specified by its operators, acknowledged as such in the record; exhaustive case checks and operator-designed satisfiability proofs excluded", why = "Step 27 outside-model review, item 90 (docs/reviews/2026-09-19-rulings.md): on the plain reading the node had already resolved on a 2016 machine-produced satisfiability proof of 200 terabytes, which is a search program's work, not a mind's; John chose option (b), reword to the machine-originated-idea form, keep open, re-estimate after checking the 2023 to 2025 candidates, logged as structure. Ruled by John 2026-09-19." },
  { date = 2026-09-20, field = "probability", old = "0.92 / 0.95 / 0.97 / 0.98 / 0.98", new = "0.95 / 0.96 / 0.97 / 0.98 / 0.98", why = "Step 27 outside-model review, item 90, the re-estimate owed after the reword: the 2023 to 2025 candidates appear to meet the new wording, so the near-window columns rise slightly; a scan resolves it or does not. Proposed 2026-09-20, accepted by John." },
]
verify = [
  "Candidates for resolution under the 2026-09-19 wording, written from memory on 2026-09-20 and to be checked at the next scan against the published record: FunSearch (Nature, December 2023), new constructions for the cap set problem found by a language-model-guided search and described by the authors as beyond the best known; and AlphaEvolve (May 2025), an improved algorithm for multiplying four-by-four complex matrices and improved bounds on several open problems including the kissing number in eleven dimensions. Neither is resolved here: under the Contact Clause null rule (docs/proposal-contact-clause-null-rule-2026-09-19.md) the criteria were written before the evidence was read against them, and the scan does the reading.",
]

[[node]]
id = "C2"
name = "Humans learn from it"
factor = "C"
kind = "world"
description = """
Beyond receiving a result: humans come to understand something conceptual they could not
have reached, in a way that changes how human science is done."""
resolution = """
A concept or method that originated with an artificial system, and that the record shows
human researchers had not reached, is adopted as a standard part of how a scientific field
works: explained in human terms in the literature and taught in at least two independently
authored textbooks, or used in the majority of new papers, in a field named when the node is
judged."""
source = "The field's textbooks and publication record"
horizon = "mid"
depends_on = ["C1"]
status = "open"
probability = { baseline = 0.8, moderate = 0.88, strong = 0.93, radical = 0.96, open = 0.97 }
estimated_on = 2026-09-20
rationale = "Adoption lags production by a decade or two, but forty-five years is long enough for one field to reorganise around one machine-born method. Re-estimated 2026-09-20 with C1 in its machine-originated-idea form: that condition is what this number always assumed, so it stands. Proposed by Claude 2026-09-20, accepted by John."
revisions = [
  { date = 2026-09-19, field = "resolution", old = "'adopted ... as evidenced by its use in textbooks or in the majority of new papers in that field'", new = "explained in human terms in the literature and taught in at least two independently authored textbooks, or used in the majority of new papers, in a field named when the node is judged", why = "Step 27 outside-model review, item 91 (docs/reviews/2026-09-19-rulings.md): textbook inclusion need not show understanding, and 'textbooks' and the field were unspecified. Ruled by John 2026-09-19." },
  { date = 2026-09-20, field = "probability", old = "0.80 / 0.88 / 0.93 / 0.96 / 0.97", new = "0.80 / 0.88 / 0.93 / 0.96 / 0.97 (re-estimated, unchanged)", why = "Step 27 outside-model review, item 92 (docs/reviews/2026-09-19-rulings.md), held for re-estimation after item 90: the reviewer's cut assumed C1 could be met by a brute-force proof that teaches nothing; with C1 reworded to a machine-originated idea, the condition is the one the number assumed, so it stands. Proposed 2026-09-20, accepted by John." },
]

[[node]]
id = "C3"
name = "An intelligence not descended from us is detected"
factor = "C"
kind = "world"
description = """
A signal or structure that only technology could have made (a technosignature), evidence of
life more complex than microbes on another world (a biosignature), or an artefact. Low
probability, fully resolvable. The instruments that would find it, a radio array on the far
side of the Moon and a telescope at the Sun's gravitational focus, are the kind of large
off-Earth projects the rest of the tree makes possible."""
resolution = """
A detection of a signal or structure that only technology could have made, of evidence of
life more complex than microbes beyond Earth, or of an artefact of non-human origin and not
made by any human or human-built system, is confirmed by at least two independent teams and
accepted as such in the peer-reviewed record."""
source = "The peer-reviewed record, two independent confirmations"
horizon = "root"
depends_on = []
status = "open"
probability = { baseline = 0.02, moderate = 0.03, strong = 0.05, radical = 0.1, open = 0.2 }
estimated_on = 2026-09-19
rationale = "Sixty years of nothing; the planned instruments widen the search by orders of magnitude but cannot make anything be there, and the biosignature route the criterion allows is the weaker one. The founding rule keeps the rung on the board; its number is small."
long_shot = true
revisions = [
  { date = 2026-09-19, field = "resolution", old = "'an artefact of non-human origin'", new = "'an artefact of non-human origin and not made by any human or human-built system'", why = "Step 27 outside-model review, item 93 (docs/reviews/2026-09-19-rulings.md): an artefact made by an AI is an edge worth closing. The complex-life clause is noted for John as a founding-decision question (definitions.md, 2026-09-08) and is not changed; no split into two nodes. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "probability", old = "0.05 / 0.07 / 0.10 / 0.18 / 0.30", new = "0.02 / 0.03 / 0.05 / 0.10 / 0.20", why = "Step 27 outside-model review, item 27 (docs/reviews/2026-09-19-rulings.md): biosignatures cannot show complexity, so the node rests on technosignatures and sixty years of silence; moved partway toward the reviewer. Ruled by John 2026-09-19." },
]
mechanism = """
Instruments improve in steps that are already planned: a far-side lunar radio array shielded
from Earth's noise, a telescope placed where the Sun's gravity focuses light from other
stars, and spectrographs that read the air of nearby planets. Each step widens what could be
seen. If anything is there within reach, one of these finds it; the remaining step is the
confirmation by a second team."""
breaking_point = """
Detection needs something to exist within reach and to be visible with the instruments we
can build. Sixty years of listening have found nothing, and every model of how common such
signals should be rests on guesses. The node cannot be made likelier by engineering alone."""

[[node]]
id = "C4"
name = "Communion"
factor = "C"
kind = "world"
description = """
Knowledge enters human understanding whose provenance is demonstrably not human and not
human-built. The dream in its most beautiful form, kept on the board by the founding rule."""
resolution = """
A verified non-human signal, whose source is placed beyond plausible human technological
reach by at least two independent physical observations recorded in the peer-reviewed
literature, is decoded into information that human researchers apply to produce a novel
peer-reviewed result, with the decoding independently reproduced."""
source = "The peer-reviewed record: the provenance observations, the decoding, and the result that applies it"
horizon = "root"
depends_on = ["C3"]
status = "open"
probability = { baseline = 0.04, moderate = 0.05, strong = 0.08, radical = 0.15, open = 0.25 }
estimated_on = 2026-09-19
rationale = "Given a detection, most detections would be a signature rather than a message, decoding may be impossible, and a decoded message would still have to teach us something we could publish; the first estimate assumed a message."
long_shot = true
mechanism = """
A confirmed detection (C3) turns out to carry structure, the structure is decoded, the
decoding is reproduced by a second team, and the decoded content is applied by human
researchers to produce a result they could not otherwise have reached, the way a message
with a proof in it could be checked. Each of those is a recognisable step from the one
before."""
breaking_point = """
Nothing to decode has ever been received, and no decoding of a non-human signal has ever
been attempted for real. Provenance is now a positive test (two independent observations
placing the source beyond human reach) rather than a proof of a negative, but both the
detection and the decoding would have to be invented."""
revisions = [
  { date = 2026-09-19, field = "resolution", old = "'a body of knowledge is received and understood by humans whose origin is established ... as neither human nor produced by any human-built system'", new = "a verified non-human signal, placed beyond plausible human technological reach by at least two independent physical observations, decoded into information that human researchers apply to produce a novel peer-reviewed result, with the decoding independently reproduced", why = "Step 27 outside-model review, items 25 and 94 (docs/reviews/2026-09-19-rulings.md): 'understood by humans' was subjective and the provenance clause proved a negative; the decoding-and-application test is checkable and the location test is positive. Mechanism and breaking point updated to match. Ruled by John 2026-09-19." },
  { date = 2026-09-19, field = "probability", old = "0.10 / 0.12 / 0.18 / 0.30 / 0.40", new = "0.04 / 0.05 / 0.08 / 0.15 / 0.25", why = "Step 27 outside-model review, item 28 (docs/reviews/2026-09-19-rulings.md): given C3, a detection is overwhelmingly likely to be incidental and decoding may be impossible; the first estimate assumed a message. Moved partway toward the reviewer. Ruled by John 2026-09-19." },
]
