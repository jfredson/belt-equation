# The five longevity scenarios (definitions.md, "The window"). The tree is run once per scenario.
# Order matters: the compute script requires a node's probability never to fall from one
# scenario to the next in this order, since each window is longer than the last.
# window_year is the deadline for that scenario. The baseline was refined from the health record on
# 2026-09-08 (roadmap step 3); only the year and a plus-or-minus come into this file, nothing else.
# Revisit it when the baseline blood panel is complete and at each annual review.
# weight is left unset on purpose: how the window factor's nodes weigh the scenarios is a
# methodology question (roadmap step 12).

[[scenario]]
key = "baseline"
name = "Baseline, no extension beyond current trends"
window_year = 2071
plus_or_minus = 8
refined_on = 2026-09-08

[[scenario]]
key = "moderate"
name = "Moderate extension"
window_year = 2080

[[scenario]]
key = "strong"
name = "Strong extension"
window_year = 2095

[[scenario]]
key = "radical"
name = "Radical extension, a 150-year life"
window_year = 2136
# added 2026-09-08 (agreed by John): a named, finite rung between strong extension and the open
# window, so the long shot has a number people can picture

[[scenario]]
key = "open"
name = "Escape velocity, window open"
# no window_year: the deadline drops out and the question becomes whether it happens at all
