# The missions I follow (the Missions page, /missions/). Ruled by John on 2026-10-20 and
# 2026-10-21 (docs/proposal-missions-to-watch-2026-10-20.md; tracker pattern rule 4.20).
#
# This file never feeds the number. A mission is here because it is worth following on the way
# out, whether or not it bears on a step of the tree. What the fields mean, and the check the
# export runs on them: data/README.md, "The missions".
#
# `operator_short` is the name shown beside the mission in the "Coming up" list; without it, the
# part of `operator` before the first comma is shown.
#
# Who may change what. The weekly reading and the daily launch-day check may change a milestone's
# date and mark it done, moved or failed, always with a source. Only John adds or removes a
# mission, adds a milestone its operator has not announced, or changes why a mission is here.
# A moved date keeps its old date in `was`, with the day it moved in `moved_on`; nothing is
# deleted. A mission whose last milestone has passed, or that is cancelled or lost, gets
# `status = "ended"` and moves to the Ended list at the foot of the page.
#
# Dates. `when` is written as precisely as the source gives it and never sharpened: a day
# ("2027-08-11"), a month ("2027-08"), a part of a year ("early 2028", "mid 2027", "late 2027"),
# or a year ("2027"). A span (sources differ, or the source gives one) is `from` and `to` in the
# same forms. `net = true` means "no earlier than". `label` replaces the written-out date only
# where the plain form would mislead. Every date was read on `checked` from the source beside it.
#
# The "why I follow it" lines (`why`) are drafts written for John in his voice on 2026-10-21, for
# him to change; `why_draft = true` until he has. The mark is private: the page stopped showing it on
# 2026-10-27 (John: a note addressed to him must never be on the public site).

checked = "2026-10-25"

