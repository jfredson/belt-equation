what = "NASA's programme to send people back to the Moon. Its first crew flew round the Moon in April 2026, [the first people beyond low Earth orbit since 1972](https://en.wikipedia.org/wiki/Artemis_II)."
why = "These are the first people to go past low Earth orbit since before I was born. If they land, and keep landing, the Moon stops being history and becomes a place people work."
