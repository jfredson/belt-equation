<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:SS;src:url(fonts/source-serif-4-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:SS;src:url(fonts/source-serif-4-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:SS;src:url(fonts/source-serif-4-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:Mono;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2)}
html,body{margin:0;background:#08070f}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,c=document.getElementById('c'),g=c.getContext('2d');
const C={bg:'#08070f',text:'#f2eee7',soft:'#d7d2c7',muted:'#968fa3',amber:'#e3a96b',violet:'#9b7bc0',cyan:'#6fb6c9',line:'rgba(255,255,255,0.12)'};

// Numbers from data/snapshots/2026-09-25-methodology-pass.json (baseline = by 2071)
const LINKS=[
 ['Cheap launch',0.11985],
 ['Power out there',0.67475],
 ['Fast ships',0.055],
 ['Bodies that hold up',0.09885],
 ['A reason to go',0.04475],
 ["Governments that don’t wreck it",0.2149],
 ['A seat for me',0.08915],
];
const DIAL=[['2071',0.0047],['2080',0.0117],['2095',0.03515],['2136',0.10705],['No limit',0.1467]];
const fmt=p=>{const v=p*100;return (v<10?v.toFixed(1):Math.round(v).toString())+'%'};

// seeded random
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const STARS=Array.from({length:520},()=>({x:rnd()*W,y:rnd()*H,r:rnd()**3*1.8+0.3,a:rnd()*0.7+0.15,z:rnd()*0.8+0.2,tw:rnd()*6.28}));
const BELT=Array.from({length:900},()=>({th:rnd()*Math.PI*2,rr:1+(rnd()+rnd()+rnd()-1.5)*0.07,s:rnd()*1.6+0.4,a:rnd()*0.5+0.15}));

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const inout=(t,a,b,c2,d)=>Math.min(eo(seg(t,a,b)),1-eio(seg(t,c2,d)));

function text(s,x,y,{font,color=C.text,align='left',alpha=1,ls=0}){
  g.save();g.globalAlpha*=alpha;g.font=font;g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';
  if(ls){g.letterSpacing=ls+'px'}
  g.fillText(s,x,y);g.restore();
}
function wrap(s,maxw,font){g.font=font;const w=s.split(' ');const out=[];let cur='';
  for(const word of w){const t=cur?cur+' '+word:word;if(g.measureText(t).width>maxw&&cur){out.push(cur);cur=word}else cur=t}
  if(cur)out.push(cur);return out}

function background(t){
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  // nebula glow
  let rg=g.createRadialGradient(1500,180,0,1500,180,900);
  rg.addColorStop(0,'rgba(155,123,192,0.16)');rg.addColorStop(1,'rgba(155,123,192,0)');
  g.fillStyle=rg;g.fillRect(0,0,W,H);
  rg=g.createRadialGradient(300,1000,0,300,1000,800);
  rg.addColorStop(0,'rgba(227,169,107,0.07)');rg.addColorStop(1,'rgba(227,169,107,0)');
  g.fillStyle=rg;g.fillRect(0,0,W,H);
  for(const s of STARS){
    const x=((s.x-t*14*s.z)%W+W)%W;
    const a=s.a*(0.75+0.25*Math.sin(t*1.3+s.tw));
    g.globalAlpha=a;g.fillStyle='#fff';g.beginPath();g.arc(x,s.y,s.r,0,6.283);g.fill();
  }
  g.globalAlpha=1;
  // the belt: a tilted ring of dust drifting slowly, low in frame
  const cx=W/2,cy=1180,rx=1250,ry=260,rot=t*0.035;
  for(const b of BELT){
    const th=b.th+rot;const x=cx+Math.cos(th)*rx*b.rr, y=cy+Math.sin(th)*ry*b.rr;
    if(y>H+5||y<0)continue;
    const front=Math.sin(th)>0?1:0.55;
    g.globalAlpha=b.a*front*1.1;g.fillStyle=Math.sin(th*7)>0.6?C.amber:'#cfc8d8';
    g.beginPath();g.arc(x,y,b.s,0,6.283);g.fill();
  }
  g.globalAlpha=1;
}

function kicker(t){
  const a=inout(t,0.1,0.8,98,99)*0.9;
  text('THE BELT EQUATION',140,110,{font:'400 22px Mono',color:C.amber,alpha:a,ls:5});
}

function sceneQuestion(t){
  const lines=['What is the probability that, before I die,','I get to live and work in a solar system where','human industry reaches beyond Earth and Mars?'];
  const out=1-eio(seg(t,7.9,8.4));
  lines.forEach((l,i)=>{
    const fd=i==0?0.8:1.8;const a=(i==0?eo:eio)(seg(t,0.4+i*2.0,0.4+i*2.0+fd))*out;
    const dy=(1-eo(seg(t,0.4+i*2.0,0.5+i*2.0+fd)))*22;
    text(l,140,420+i*96+dy,{font:(i==2?'italic ':'')+'400 70px SS',color:i==2?C.amber:C.text,alpha:a});
  });
}

function sceneChain(t){
  if(t<4.2||t>10.8)return;
  const fadeAll=1-eio(seg(t,10.0,10.6));
  const conv=eio(seg(t,9.75,10.55)); // converge to centre
  text('Seven things all have to go right.',140,300,{font:'400 64px SS',alpha:inout(t,4.3,4.9,9.6,10.1)});
  text('Each link’s chance by 2071',140,352,{font:'400 22px Mono',color:C.muted,alpha:inout(t,4.6,5.2,9.6,10.1),ls:1});
  const x0=230,x1=1690,y=580,n=LINKS.length;
  const xs=LINKS.map((_,i)=>x0+(x1-x0)*i/(n-1));
  const lineP=eio(seg(t,4.7,8.6));
  // connecting line
  g.save();g.globalAlpha=fadeAll;g.strokeStyle='rgba(227,169,107,0.45)';g.lineWidth=2;
  g.beginPath();g.moveTo(x0+(W/2-x0)*conv,y);g.lineTo((x0+(x1-x0)*lineP)+(W/2-(x0+(x1-x0)*lineP))*conv,y);g.stroke();g.restore();
  LINKS.forEach(([name,p],i)=>{
    const tAppear=4.7+(8.6-4.7)*i/(n-1)-0.15;
    const a=eo(seg(t,tAppear,tAppear+0.45))*fadeAll;
    if(a<=0)return;
    const x=xs[i]+(W/2-xs[i])*conv, yy=y;
    const R=64*(1-conv*0.7);
    const sweep=eo(seg(t,tAppear+0.1,tAppear+0.9));
    g.save();g.globalAlpha=a;
    g.fillStyle=C.bg;g.beginPath();g.arc(x,yy,R,0,6.283);g.fill();
    g.strokeStyle='rgba(255,255,255,0.14)';g.lineWidth=6;g.beginPath();g.arc(x,yy,R,0,6.283);g.stroke();
    g.strokeStyle=C.amber;g.lineCap='round';g.beginPath();g.arc(x,yy,R,-Math.PI/2,-Math.PI/2+6.283*p*sweep);g.stroke();
    g.restore();
    const labelA=a*(1-conv);
    text(fmt(p*sweep),x,yy+11,{font:'400 30px Mono',color:C.text,align:'center',alpha:labelA});
    const lines=wrap(name,200,'400 29px SS');
    lines.forEach((l,j)=>text(l,x,yy+R+56+j*36,{font:'400 29px SS',color:C.soft,align:'center',alpha:labelA}));
  });
  ['These are the numbers played out 20,000 times. The links build on each other,','so when one comes true, the ones that depend on it get more likely.'].forEach((l,k)=>
    text(l,140,880+k*46,{font:'italic 400 34px SS',color:C.muted,alpha:inout(t,8.9,9.4,9.9,10.3)}));
}

// Dial: a stop at each date with a reading hold, then a move to the next
const NOTES=[
 'If I live about as long as a man my age is expected to.',
 'If medicine adds about a decade to a life like mine.',
 'If I make it to 109 with strong life extension, still only theorized.',
 'A 150-year life. The long shot this project keeps in view.',
 'Aging solved outright. The odds then depend only on whether it happens at all.',
];
const D0=11.0, HOLD=4.0, MOVE=0.8, STEP=HOLD+MOVE;
const DEND=D0+STEP*(DIAL.length-1)+HOLD; // last stop's hold ends
function dialK(t){
  const j=Math.floor((t-D0)/STEP);
  if(t<D0)return 0;
  if(j>=DIAL.length-1)return DIAL.length-1;
  const into=t-D0-j*STEP;
  return j+(into<HOLD?0:eio((into-HOLD)/MOVE));
}
function sceneHeadline(t){
  if(t<10.1)return;
  const a=eo(seg(t,10.6,11.6));
  const up=eio(seg(t,DEND,DEND+0.7));
  const k=dialK(t);
  const i0=Math.floor(k),i1=Math.min(DIAL.length-1,i0+1),f=k-i0;
  const p=Math.exp(Math.log(DIAL[i0][1])*(1-f)+Math.log(DIAL[i1][1])*f);
  const idx=Math.round(k);
  const when=idx==DIAL.length-1?'with no deadline':'by '+DIAL[idx][0];
  const cy=540-up*130, sc=1-up*0.35;
  text('The chance it happens for me',W/2,cy-230*sc,{font:`400 ${Math.round(42*sc)}px SS`,color:C.soft,align:'center',alpha:a*(1-up)});
  DIAL.forEach(([lab,pj],j)=>{
    const st=j==0?10.6:D0+(j-1)*STEP+HOLD+0.3;
    const fin=eio(seg(t,st,st+(j==0?1.6:MOVE)));
    const fout=j==DIAL.length-1?1:1-eio(seg(t,D0+j*STEP+HOLD,D0+j*STEP+HOLD+0.5));
    const na=Math.min(fin,fout);
    if(na<=0)return;
    const w=j==DIAL.length-1?'with no deadline':'by '+lab;
    g.save();g.shadowColor='rgba(227,169,107,0.35)';g.shadowBlur=60;
    text(fmt(pj),W/2,cy+70*sc,{font:`400 ${Math.round(250*sc)}px SS`,color:C.amber,align:'center',alpha:na});
    g.restore();
    text(w,W/2,cy+150*sc,{font:`400 ${Math.round(34*sc)}px Mono`,color:C.text,align:'center',alpha:na,ls:2});
  });
  // explanation for the current stop
  NOTES.forEach((n,j)=>{
    const st=D0+j*STEP;
    const na=Math.min(eio(seg(t,st+0.3,st+1.9)),1-eio(seg(t,st+HOLD-0.25,st+HOLD+0.15)));
    if(na>0)text(n,W/2,790,{font:'italic 400 36px SS',color:C.soft,align:'center',alpha:na});
  });
  // year dial
  const da=inout(t,10.6,11.0,DEND-0.1,DEND+0.4);
  const dx0=W/2-520,dx1=W/2+520,dy=900;
  g.save();g.globalAlpha=da;g.strokeStyle=C.line;g.lineWidth=2;g.beginPath();g.moveTo(dx0,dy);g.lineTo(dx1,dy);g.stroke();g.restore();
  DIAL.forEach(([lab],j)=>{const x=dx0+(dx1-dx0)*j/(DIAL.length-1);
    g.save();g.globalAlpha=da;g.fillStyle=C.muted;g.beginPath();g.arc(x,dy,5,0,6.283);g.fill();g.restore();
    text(lab,x,dy+48,{font:'400 24px Mono',color:Math.abs(k-j)<0.5?C.text:C.muted,align:'center',alpha:da});});
  const mx=dx0+(dx1-dx0)*k/(DIAL.length-1);
  g.save();g.globalAlpha=da;g.fillStyle=C.amber;g.beginPath();g.arc(mx,dy,11,0,6.283);g.fill();g.restore();
  text('How long I live',dx0,dy-30,{font:'400 22px Mono',color:C.muted,alpha:da,ls:1});
}

function sceneClose(t){
  if(t<DEND)return;
  const a=eo(seg(t,DEND+0.4,DEND+1.0)), b=eio(seg(t,DEND+2.4,DEND+3.2));
  text('The odds move as the world does.',W/2,690,{font:'400 58px SS',color:C.text,align:'center',alpha:a});
  text('beltequation.com',W/2,790,{font:'400 40px Mono',color:C.amber,align:'center',alpha:b,ls:2});
  text('Calculate your own odds.',W/2,870,{font:'italic 400 36px SS',color:C.soft,align:'center',alpha:eio(seg(t,DEND+4.4,DEND+5.2))});
}

function render(t,bt,qt){
  g.globalAlpha=1;
  background(bt===undefined?t:bt);kicker(t);sceneQuestion(qt===undefined?t:qt);sceneChain(t);sceneHeadline(t);sceneClose(t);
}
window.render=render;
window.ready=Promise.all(['400 70px SS','italic 400 70px SS','600 70px SS','400 30px Mono'].map(f=>document.fonts.load(f)));
</script></body></html>
